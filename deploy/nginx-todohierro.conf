# Configuración de nginx para el portal de Todo Hierro.
#
# Reemplaza a deploy/web.config (IIS) de la instalación original sobre
# Windows Server. Sirve apps/web/dist como estático y hace de proxy inverso
# de /api hacia el proceso de Node, que sigue escuchando sólo en 127.0.0.1:
# nginx es el único camino hacia el API, igual que era IIS antes.
#
# CAMBIAR antes de instalar:
#   - server_name   el dominio real (por ejemplo todohierro.emiliomuller.com)
#   - root           ya apunta a /home/sistema/webTodoHierro/apps/web/dist.
#                     Si el clon se mueve, cambiarlo: nginx no expande "~",
#                     la ruta tiene que ser absoluta. nginx corre como
#                     www-data: necesita "chmod o+x /home/sistema".
#
# Instalación (detalle completo en docs/02-despliegue.md):
#   sudo cp deploy/nginx-todohierro.conf /etc/nginx/sites-available/todohierro
#   sudo ln -s /etc/nginx/sites-available/todohierro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU-DOMINIO
#
# certbot reescribe este archivo: agrega el bloque 443 con el certificado y
# convierte el bloque de abajo en un redirect automático hacia HTTPS. Lo que
# sigue es la base sobre la que certbot construye — no hace falta escribir el
# bloque 443 a mano.

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO;

    root /home/sistema/webTodoHierro/apps/web/dist;
    index index.html;

    # nginx no anuncia su versión por defecto en las páginas de error, pero sí
    # en el encabezado Server de cada respuesta. No hace falta que lo haga.
    server_tokens off;

    client_max_body_size 1m;

    # --- Si Cloudflare sigue proxeando el tráfico (nube naranja) ------------
    # Sin esto, nginx ve la IP de Cloudflare como origen de TODAS las visitas,
    # no la del visitante real. El freno de intentos de login
    # (freno-login.service.ts) usa esa IP: un intento fallido de cualquiera
    # bloquearía el login para todo el mundo durante 15 minutos — el mismo
    # bug de fondo que ya se evitó en apps/api/src/main.ts con
    # `trust proxy: 'loopback'`, pero un escalón más atrás. Descomentar y
    # completar con los rangos vigentes de https://www.cloudflare.com/ips/
    # (cambian rara vez, pero conviene revisar la fecha de esa página).
    #
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # (rangos IPv6 en la misma página, si Cloudflare llega a habilitarlos acá)

    # /api va al proceso de Node. Va primero: si quedara después de la regla
    # del SPA, cualquier ruta del API terminaría devolviendo el index.html y
    # el error sería "la pantalla carga pero no trae datos" — el mismo
    # comentario que tenía deploy/web.config con IIS.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La cookie de sesión es HttpOnly y Path=/. Sin esto un proxy podría
        # reescribir el Path y romper el login.
        proxy_cookie_path / /;
    }

    # El index.html nunca se cachea: si queda pegado, el navegador sigue
    # pidiendo los assets de la versión anterior después de publicar.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Los assets que compila Vite llevan un hash en el nombre: un archivo
    # nuevo tiene un nombre nuevo, así que se pueden cachear fuerte.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Todo lo que no sea un archivo existente va al index.html, porque el
    # ruteo lo resuelve React en el navegador. Sin esto, recargar estando en
    # /login devuelve 404.
    location / {
        try_files $uri /index.html;
    }
}
